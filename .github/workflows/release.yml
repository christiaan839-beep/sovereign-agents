# Publishes a release from a vX.Y.Z tag on a commit on main. The tag must
# match the version in pyproject.toml. CI runs first; the build job
# attests the provenance of the sdist and wheel it built; the GitHub
# release waits for a maintainer to approve the protected "release"
# environment and takes its notes from the tag's CHANGELOG.md section.
#
# Not published to PyPI yet: the package depends on verifiable-receipts by
# git commit, and PyPI refuses direct URL dependencies. RELEASING.md has
# the steps.
#
# Actions are pinned to full commit SHAs (the tag each SHA had when pinned
# is in the comment). Every job starts with no token permissions and asks
# only for what it uses.
name: release
on:
  push:
    tags:
      - "v*"
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read pyproject.toml and main's history
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: The tag names the version in pyproject.toml and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z"; exit 1
          fi
          have=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$have" != "$version" ]; then
            echo "::error::tag says $version, pyproject.toml says $have"; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::the tagged commit is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: plan
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read # check out the code to test

  build:
    name: Build the sdist and wheel
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-uv checks the uv binary's checksum; the cache stays off.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: Keep the attestation bundle next to the files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/dist/attestation.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  github-release:
    name: Create the GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        # The notes are the tag's section of CHANGELOG.md; without one, GitHub's
        # generated notes.
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 || index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > "$notes"
          args=(--verify-tag --title "$TAG")
          if [ -s "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$TAG" "${args[@]}" dist/*
