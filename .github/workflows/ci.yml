# Lint, types, tests (with the attack evals and a check of every receipt they leave) under
# coverage gates, and actionlint, on every push and pull request.
# The token is read-only, actions are pinned to commit SHAs, and no event text is ever
# interpolated into a run step.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - name: Install the project
        run: uv sync --locked
      - name: the demo, end to end on the sample, with the fake model
        run: printf 'y\ny\n' | SOVEREIGN_AGENTS_HOME="$RUNNER_TEMP/demo-home" uv run sovereign-agents demo
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest, tests and evals, with branch coverage (90% overall)
        run: uv run pytest -q --cov --cov-branch --cov-report=term-missing
      - name: ledger, gates and receipts at 100% branch coverage
        run: uv run python scripts/check_coverage.py
