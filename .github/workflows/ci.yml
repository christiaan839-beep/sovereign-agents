# Lint, types, tests (with the attack evals and a check of every receipt they leave) under
# coverage gates, and actionlint, on every push and pull request.
# The token is read-only, actions are pinned to commit SHAs, and no event text is ever
# interpolated into a run step.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - name: Install the project
        run: uv sync --locked
      - name: the demo, end to end on the sample, with the fake model
        run: printf 'y\ny\n' | SOVEREIGN_AGENTS_HOME="$RUNNER_TEMP/demo-home" uv run sovereign-agents demo
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest, tests and evals, with branch coverage (90% overall)
        run: uv run pytest -q --cov --cov-branch --cov-report=term-missing
      - name: ledger, gates and receipts at 100% branch coverage
        run: uv run python scripts/check_coverage.py
