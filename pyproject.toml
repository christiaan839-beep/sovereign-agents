[project]
name = "sovereign-agents"
version = "0.1.0"
description = "Sovereign Matrix's agent kit: one Claude agent for one small-business job, every action approved and signed."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["NOTICE", "third_party/commerce-agents/LICENSE"]
dependencies = [
    "claude-agent-sdk==0.2.168",
    "cryptography==50.0.2",
    "jsonschema==4.26.0",
    "sovereign-matrix-verifiable-receipts @ git+https://github.com/christiaan839-beep/verifiable-receipts@24f5c4780dba7c4f76b159b7f7844e17d0226cd6#subdirectory=packages/verifiable-receipts-py",
]

[project.scripts]
sovereign-agents = "sovereign_agents.cli:main"

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["conftest.py", "src", "tests", "evals", "scripts"]

[[tool.mypy.overrides]]
module = ["sovereign_matrix.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = ["-ra", "--strict-markers"]
markers = ["forged_receipts: the test stores receipts that must fail verification"]

[tool.coverage.run]
branch = true
source = ["sovereign_agents"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.sovereign_agents.coverage]
# Held to full branch coverage by scripts/check_coverage.py: files, or folders of .py files.
critical = [
    "src/sovereign_agents/kit/ledger.py",
    "src/sovereign_agents/kit/receipts.py",
    "src/sovereign_agents/kit/gates.py",
]
critical_fail_under = 100
